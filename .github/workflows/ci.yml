name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

# Both jobs already declare `contents: read`, so this changes nothing today. It
# is the floor for a job added later without a permissions block of its own,
# which would otherwise inherit the repository default — and it is what
# Scorecard's Token-Permissions check reads.
permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Pure bash, reads only `apps/*` and this file, so it runs before the
      # install and costs nothing. It lives here rather than only inside
      # `pnpm check`/`pnpm verify` because this job runs its gates individually
      # and calls neither wrapper — a gate reachable only through them is not a
      # pre-merge gate at all, it is a next-morning email from the scheduled
      # `maintenance.yml` run against already-merged `main`.
      - name: App wiring
        run: bash ./infra/scripts/check-app-wiring.sh

      # Same placement rationale as App wiring above: no `node_modules` needed,
      # and a missing symlink means a workspace's AGENTS.md reaches no agent.
      - name: AGENTS.md symlinks
        run: bash ./infra/scripts/check-agents-md-symlinks.sh

      - name: Stale comments
        run: node ./infra/scripts/check-stale-comments.mjs

      # Same placement rationale — pure bash over `git ls-files`, no
      # `node_modules`. A doc naming a script the repo does not ship is
      # asserting config no reviewer can see and no clone gets.
      - name: Doc script references
        run: bash ./infra/scripts/check-doc-script-refs.sh

      # Same placement rationale. This repo is public, so a runner on the
      # owner's hardware would execute fork-PR code on the home lab.
      - name: Runner labels
        run: node ./infra/scripts/check-runner-labels.mjs

      # Same placement rationale as the gates above — bash and jq over fixture
      # files, no `node_modules`. `watch-pr.sh` is the one script in this repo
      # that arms an unattended merge, and this suite is the only thing that
      # exercises its gate: that a partial checks list does not read as green,
      # that a red required context stops before the ping, and that an empty
      # checks list is not counted as an API failure. It reaches the network on
      # no path — asserted by running it with a `gh` stub on PATH that logs and
      # exits 99, which came back with zero invocations.
      #
      # (jq is in the ubuntu-24.04 runner image's tool list — read from that
      # list, not measured here; no other step in this workflow uses jq.)
      - name: Ship-pr fixtures
        run: bash ./.claude/skills/ship-pr/scripts/fixtures/run-fixtures.sh

      # Same placement rationale — bash and jq against synthetic payloads and
      # transcript fixtures, no `node_modules`. Exercises the loaded-skill
      # check in writing-docs-reminder.sh, composing-context-reminder.sh and
      # problem-solving-reminder.sh. These fixtures are the only signal those
      # hooks get: suppression is silent by design — no output, exit 0 — so a
      # detection that broke reads exactly like one that worked.
      - name: Reminder hook fixtures
        run: bash ./infra/scripts/check-reminder-hooks.sh

      # The repo's shell reaches no other static analysis: CodeQL has no shell
      # extractor, `.claude/` is in no pnpm workspace so turbo never sees it, and
      # prettier has no bash parser. A step in `Verify` rather than a job of its
      # own, for the same reason as the gates above — `Verify` is already
      # required on `main`, so a new job would need arming as a required check
      # before it gated anything.
      #
      # `git ls-files` rather than a committed list of paths, so a script added
      # later is covered without anyone remembering this file. It finds only
      # `*.sh`; an extension-less script with a shebang is not checked.
      #
      # Uses the runner image's shellcheck rather than an action. GitHub's
      # ubuntu-24.04 image ships 0.9.0 and this repo already leans on that image
      # having Docker preinstalled in the `Images` job below.
      - name: Shellcheck
        run: |
          shellcheck --version
          git ls-files -z -- '*.sh' | xargs -0 -r shellcheck --

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unlike the gates above, this needs node_modules: it imports
      # @unimatrix/deploy-config and apps/api/src/config.ts by absolute path,
      # and generate-deploy-config.mjs --check formats through prettier's
      # API. It is the only thing that reads apps/*/Dockerfile and
      # infra/docker/*-compose.yaml at all — Images (*) builds each
      # Dockerfile directly and never opens a compose file, so one that stops
      # passing env into a perfectly good image is green everywhere until
      # production restart-loops.
      - name: Deploy config
        run: pnpm check:deploy-config

      - name: Install Playwright Chromium
        run: |
          pnpm --filter @unimatrix/web exec playwright install --with-deps chromium
          pnpm --filter @unimatrix/cflop exec playwright install --with-deps chromium

      # Runs before the expensive steps: formatting is the cheapest thing that
      # can be wrong, so failing here saves a full build/test cycle.
      - name: Format
        run: pnpm format:check

      # Also cheap, and it catches a class of problem the rest of the pipeline
      # cannot: one workspace drifting to a different version of a shared
      # dependency builds and tests green in isolation, then behaves differently
      # from its siblings at runtime.
      - name: Dependency versions
        run: pnpm deps:check

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Reads the `coverage/coverage-summary.json` the step above writes, so it
      # has to follow it. Catches a floor left far below what its workspace
      # actually measures — slack a real regression can hide inside while the
      # gate stays green.
      - name: Coverage drift
        run: pnpm check:coverage-drift

      # Last, because it is the slowest step: a real Chrome run against every
      # previewable route. `pnpm test` has already built both apps, and the
      # script resolves Playwright's Chromium itself rather than needing a
      # system Chrome or a CHROME_PATH set here.
      #
      # Reports stay on the runner. They are uploaded as a build artifact
      # below, never to an external service.
      - name: Lighthouse budgets
        run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: apps/*/.lighthouse/**
          retention-days: 7
          # THIS is what was broken: `include-hidden-files` defaults to false,
          # and `.lighthouse` is a dot-prefixed directory, so every report under
          # it was excluded as a hidden file. The step logged "No files were
          # found" and passed anyway on every run the workflow has ever done.
          include-hidden-files: true
          # Was `ignore`, which is what let the above look like a pass. `warn`
          # annotates a genuinely empty run — legitimate when the Lighthouse step
          # itself failed, since `always()` runs this either way — without
          # turning one failure into two.
          if-no-files-found: warn

  # `Verify` builds with Vite and tsc; it never touches a Dockerfile. That left a
  # whole class of breakage invisible: a dependency can pass every check on the
  # runner while making the deployable image unbuildable.
  #
  # Not hypothetical. `better-sqlite3@13` publishes no prebuilt binaries at all
  # (12.11.1 ships 138), so it falls through to `node-gyp rebuild` and dies on
  # `node:*-alpine` with `gyp ERR! find Python` — while `pnpm verify` stays green
  # on the glibc runner, because glibc has a prebuild. Caught by hand on
  # 2026-07-27; nothing in CI would have caught it.
  #
  # Build only, no push and no registry credentials. The point is that the image
  # still assembles, which is exactly the signal `Verify` cannot give.
  images:
    name: Images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    strategy:
      # Do not cancel the others on the first failure — knowing whether a break
      # is confined to one image or affects all of them is most of the
      # diagnosis, and re-running to find out costs another full cycle.
      fail-fast: false
      # Every `apps/*/Dockerfile` must appear here. The `App wiring` step in
      # the `Verify` job above fails the build if one does not.
      # Adding an entry is only half the job: the matching `Images (<app>)`
      # check also has to be armed as required on `main`, or the image is built
      # and its result ignored.
      matrix:
        app: [admin, api, auth, cflop, deploy, secrets, web]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Plain `docker build` against the runner's preinstalled Docker, rather
      # than the buildx actions. It needs no third-party action to pin and no
      # cache to invalidate, the build context is the repo itself, and the image
      # lands in the local daemon where the cflop step below needs it.
      #
      # A layer cache cannot buy wall clock here however well it works: compare
      # any run's `Images (*)` durations against `Verify` in the same run — the
      # whole matrix finishes minutes before `Verify` does, so this job is never
      # the critical path. A per-app Blacksmith sticky-disk cache was measured
      # over three runs on main and produced zero `CACHED` layers in all 18
      # jobs, while adding ~5s of action setup to each.
      - name: Build ${{ matrix.app }} image
        run: docker build --file "apps/${{ matrix.app }}/Dockerfile" --tag "unimatrix-${{ matrix.app }}:ci" .

      # cflop serves one HTML file per route and returns real 404s, which lives
      # entirely in its `nginx.conf`. Nothing else reaches it: the unit suite
      # starts no server, Playwright drives a client router that renders a
      # not-found card over a 200, and `vite preview` reproduces none of the
      # rules. Here because this job is the only one with a built image.
      - name: cflop serving contract
        if: matrix.app == 'cflop'
        run: bash ./infra/scripts/check-cflop-serving.sh "unimatrix-cflop:ci"

  # A separate job from `images` rather than a push step inside it, because
  # `Images (<app>)` is a required check and must keep meaning "this image
  # builds" — folding a registry push into it would make the same check mean
  # "the image builds and the registry accepted it", and the second half can
  # fail for reasons (GHCR auth, rate limits) that have nothing to do with
  # whether the image is good.
  #
  # Deliberately **not** armed as a required check. The reason is not that it
  # never reports — a job skipped by the `if:` below still produces a check
  # run with conclusion `skipped`, and this repo's own `watch-pr.sh` maps
  # `skipping` to green. The reason is that arming it would create a
  # permanently-green required check on every pull request: this job never
  # runs on `pull_request` at all (see `if:` below), so it would report
  # green while verifying nothing.
  #
  # `needs: [verify, images]` so a `main`-branch failure cannot move the
  # `:main` tag onto a bad commit.
  #
  # `images` is not redundant with this job's own build. It runs one assertion
  # this job does not: `check-cflop-serving.sh` against the built cflop image,
  # which is the only thing anywhere that proves cflop serves real 404s rather
  # than a 200 with a not-found card. Without the dependency, a broken serving
  # contract reddens `Images (cflop)` and publishes the image regardless.
  #
  # The wait costs nothing measurable — the whole `images` matrix finishes in
  # well under a minute against `Verify`'s ~6, so `verify` is the long pole
  # either way, on a path nothing downstream waits on yet.
  publish:
    name: Publish
    needs: [verify, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Both a push to main and a manual dispatch from any branch are allowed
    # to run; only the push-to-main path is permitted to move the `:main`
    # tag (see the tag/push steps below).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        app: [admin, api, auth, cflop, deploy, secrets, web]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

      # No build args: Task 1 (deploy.config.ts) gave every SPA's ARG a
      # production default, so the image built here is correct without any.
      # No buildx, no QEMU, no `--platform` — same reasoning as `Images`
      # above: the deploy host and this runner are both amd64, so a plain
      # `docker build` against the runner's preinstalled Docker is enough.
      - name: Build and tag ${{ matrix.app }} image
        env:
          APP: ${{ matrix.app }}
          IMAGE: ghcr.io/unimatrixcore/unimatrix-${{ matrix.app }}
          REVISION: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          tag_args=(--tag "$IMAGE:$REVISION")
          if [ "$IS_MAIN_PUSH" = "true" ]; then
            tag_args+=(--tag "$IMAGE:main")
          fi
          docker build \
            --file "apps/$APP/Dockerfile" \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$REVISION" \
            "${tag_args[@]}" \
            .

      # The SHA tag always pushes; the moving `main` tag pushes only on a
      # push to main (see `IS_MAIN_PUSH` above) — a `workflow_dispatch` run
      # against a feature branch must never move `:main` onto a branch build.
      - name: Push ${{ matrix.app }} image
        env:
          IMAGE: ghcr.io/unimatrixcore/unimatrix-${{ matrix.app }}
          REVISION: ${{ github.sha }}
          IS_MAIN_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          docker push "$IMAGE:$REVISION"
          if [ "$IS_MAIN_PUSH" = "true" ]; then
            docker push "$IMAGE:main"
          fi

  # Every `infra/docker/*-compose.yaml` names `image:` and no `build:`, so a
  # deploy builds nothing: it writes the tag to run and then asks Dokploy to
  # pull it. Two API calls, in that order, or the deploy re-runs the tag that
  # was already there.
  #
  # Deliberately **not** armed as a required check, for the same reason as
  # `Publish`: it never runs on `pull_request`, so arming it would create a
  # required check that is permanently green on every PR while verifying
  # nothing.
  #
  # The `if:` is narrower than `Publish`'s on purpose. A `workflow_dispatch`
  # from a feature branch may publish a SHA-tagged image, but must never be
  # able to point production at it.
  #
  # One job rather than a matrix: the calls (one per infra/docker/*-compose.yaml)
  # share one credential and one project-level write, so a matrix would race on
  # that write and report a red check per stack for one outage.
  #
  # The workflow-level `concurrency` block above has `cancel-in-progress: true`
  # and covers this job, so a second push to `main` can cancel this one
  # mid-flight — leaving `IMAGE_TAG` written with no deploy issued. The next
  # merge heals it, but until then Dokploy's project env reads as deployed when
  # nothing was.
  deploy:
    name: Deploy
    needs: [publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      # For `infra/docker/*-compose.yaml` alone: the stacks to deploy are
      # derived from those filenames rather than listed here, so an app added
      # to the matrices above cannot be silently left undeployed.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Dokploy hostname is in `docs/deployment.md` already, so it lives
      # here where a reviewer can see it rather than in a secret. The API key is
      # instance-wide and the Cloudflare pair is what gets past Access on the
      # origin — without it every call answers 302 from
      # `unimatrix-01.cloudflareaccess.com`.
      - name: Point Dokploy at this commit and deploy
        env:
          DOKPLOY_URL: https://dokploy.unimatrix-01.dev
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          failures=()

          # Without nullglob an unmatched glob expands to the pattern itself,
          # so the zero-file guard below would be unreachable.
          shopt -s nullglob

          apps=()
          for compose_file in infra/docker/*-compose.yaml; do
            base="$(basename "$compose_file")"
            apps+=("${base%-compose.yaml}")
          done

          if [ "${#apps[@]}" -eq 0 ]; then
            echo "::error::no infra/docker/*-compose.yaml found — refusing to deploy vacuously"
            exit 1
          fi

          # Never prints a response body. `project.all` returns every project's
          # whole environment-variable blob and this repository's run logs are
          # public; the status code is what diagnoses these calls anyway.
          # `-f` is not used: it treats a 302 as success, and a 302 is the most
          # likely first failure here.
          call() {
            local method="$1" path="$2" body="$3" out="$4" status
            local args=(--silent --show-error -X "$method" "${DOKPLOY_URL}${path}"
              -H "x-api-key: ${DOKPLOY_API_KEY}"
              -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}"
              -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}"
              -o "$out" -w '%{http_code}')
            if [ -n "$body" ]; then
              args+=(-H 'content-type: application/json' --data "$body")
            fi
            status="$(curl "${args[@]}" || true)"
            printf '%s' "${status:-000}"
          }

          hint() {
            case "$1" in
              302) printf ' (Cloudflare Access is in front of this endpoint — check CF_ACCESS_CLIENT_ID/CF_ACCESS_CLIENT_SECRET)' ;;
              401) printf ' (Dokploy rejected DOKPLOY_API_KEY)' ;;
              000) printf ' (curl could not complete the request)' ;;
              *) printf '' ;;
            esac
          }

          status="$(call GET /api/project.all "" "${work}/projects.json")"
          if [ "$status" != "200" ]; then
            echo "::error::GET /api/project.all returned ${status}$(hint "$status")"
            exit 1
          fi

          # Resolved per run rather than hardcoded: a compose service that is
          # renamed or recreated gets a new id, and a stale map would deploy
          # the wrong stack or nothing at all.
          declare -A compose_id_of=()
          declare -A project_of=()

          for app in "${apps[@]}"; do
            mapfile -t matches < <(jq -r --arg app "$app" \
              '.[] | .projectId as $project | .environments[]?.compose[]?
               | select(.name == $app) | "\($project) \(.composeId)"' \
              "${work}/projects.json")

            if [ "${#matches[@]}" -ne 1 ]; then
              failures+=("${app}: Dokploy has ${#matches[@]} compose service(s) named '${app}', need exactly 1")
              continue
            fi

            project_of["$app"]="${matches[0]%% *}"
            compose_id_of["$app"]="${matches[0]##* }"
          done

          # One blind write per distinct project. `project.update` is a partial
          # the router spreads over the row, so this REPLACES the project's
          # whole env blob — safe only because project-level env holds
          # IMAGE_TAG and nothing else. Keep it that way: reading it back to
          # merge would pull whatever it holds into a public repository's
          # runner, which is why this never does.
          declare -A project_written=()

          if [ "${#project_of[@]}" -gt 0 ]; then
            for project in $(printf '%s\n' "${project_of[@]}" | sort -u); do
              status="$(call POST /api/project.update \
                "{\"projectId\":\"${project}\",\"env\":\"IMAGE_TAG=${IMAGE_TAG}\"}" \
                "${work}/update.json")"
              if [ "$status" = "200" ]; then
                project_written["$project"]=1
              else
                failures+=("project ${project}: POST /api/project.update returned ${status}$(hint "$status")")
              fi
            done
          fi

          # Sequential, and only for a project whose tag actually landed:
          # deploying against the old tag would queue a deploy of the previous
          # commit and report it as this one.
          for app in "${apps[@]}"; do
            compose_id="${compose_id_of[$app]:-}"
            [ -n "$compose_id" ] || continue

            if [ -z "${project_written[${project_of[$app]}]:-}" ]; then
              failures+=("${app}: skipped — its project's IMAGE_TAG write failed, so a deploy would run the previous commit")
              continue
            fi

            status="$(call POST /api/compose.deploy \
              "{\"composeId\":\"${compose_id}\",\"title\":\"CI ${IMAGE_TAG}\"}" \
              "${work}/deploy.json")"
            if [ "$status" = "200" ]; then
              echo "${app}: deployment queued"
            else
              failures+=("${app}: POST /api/compose.deploy returned ${status}$(hint "$status")")
            fi
          done

          if [ "${#failures[@]}" -gt 0 ]; then
            for failure in "${failures[@]}"; do
              echo "::error::${failure}"
            done
            exit 1
          fi

          # Queued, not applied. A 200 from Dokploy is an acknowledgement that
          # the deploy was accepted; the container being recreated is the only
          # signal it landed, and that can be minutes later — see
          # docs/deployment.md, "A deploy is queued, not applied".
          echo "${#apps[@]} stack(s) queued at ${IMAGE_TAG}. Queued is not applied."
