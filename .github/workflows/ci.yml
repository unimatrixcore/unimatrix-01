name: CI ingress validation
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - name: Probe existing reporting identity without deployment mutations
        env:
          DEPLOY_REPORT_URL: ${{ vars.DEPLOY_REPORT_URL }}
          DEPLOY_REPORT_TOKEN: ${{ secrets.DEPLOY_REPORT_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'JS'
          const base = process.env.DEPLOY_REPORT_URL;
          if (base !== 'https://deploy-ci.unimatrix-01.dev') throw new Error('Unexpected reporting origin');
          for (const key of ['DEPLOY_REPORT_TOKEN', 'CF_ACCESS_CLIENT_ID', 'CF_ACCESS_CLIENT_SECRET']) {
            if (!process.env[key]) throw new Error('Missing probe credential');
          }
          const access = {
            'CF-Access-Client-Id': process.env.CF_ACCESS_CLIENT_ID,
            'CF-Access-Client-Secret': process.env.CF_ACCESS_CLIENT_SECRET,
          };
          const checks = [
            ['POST', '/deployment/attempts/intent', false, false, [403]],
            ['POST', '/deployment/attempts/intent', true, false, [401]],
            ['POST', '/deployment/attempts/intent', true, true, [400]],
            ['POST', '/deployment/execute', true, false, [401]],
            ['POST', '/deployment/execute', true, true, [400, 404]],
            ['GET', '/deployment/attempts/intent', true, true, [404]],
            ['GET', '/health', true, true, [200]],
            ['GET', '/deployment/baselines', true, false, [401]],
            ['GET', '/deployment/baselines', true, true, [200]],
            ['POST', '/deployment/rollback', true, true, [404]],
            ['POST', '/deployment/attempts/report', true, true, [404]],
          ];
          for (const [method, path, withAccess, withToken, expected] of checks) {
            const response = await fetch(base + path, {
              method, redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: {
                'content-type': 'application/json',
                ...(withAccess ? access : {}),
                ...(withToken ? {Authorization: `Bearer ${process.env.DEPLOY_REPORT_TOKEN}`} : {}),
              },
              ...(method === 'POST' ? {body: '{}'} : {}),
            });
            const status = response.status;
            if (path === '/health' && status === 200 && response.headers.get('x-deploy-capabilities') !== 'commit-subject-v1') throw new Error('Missing commit-subject capability');
            if (path === '/deployment/baselines' && status === 200) {
              const snapshot = await response.json();
              if (!Array.isArray(snapshot.apps) || snapshot.apps.length !== 8 || snapshot.apps.some(x => !x.baseline)) throw new Error('Missing service baselines');
              for (const entry of snapshot.apps) console.log(`Verified baseline: ${entry.app} ${entry.baseline.commit}`);
            } else await response.body?.cancel();
            console.log(`${method} ${path}: ${status} (Access=${withAccess}, service token=${withToken})`);
            if (!expected.includes(status)) throw new Error('Reporting boundary probe failed');
          }
          JS
