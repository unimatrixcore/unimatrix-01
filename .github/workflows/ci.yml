name: CI deployment preflight diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
      - name: Read deployment preflight status
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DEPLOY_REPORT_TOKEN: ${{ secrets.DEPLOY_REPORT_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const access = {'CF-Access-Client-Id':process.env.CF_ACCESS_CLIENT_ID,'CF-Access-Client-Secret':process.env.CF_ACCESS_CLIENT_SECRET};
          for (const [origin,path,method,auth] of [
            ['https://dokploy.unimatrix-01.dev','/api/project.all','GET',{'x-api-key':process.env.DOKPLOY_API_KEY}],
            ['https://deploy-ci.unimatrix-01.dev','/deployment/attempts/intent','POST',{Authorization:`Bearer ${process.env.DEPLOY_REPORT_TOKEN}`}],
          ]) {
            const r=await fetch(origin+path,{method,redirect:'manual',headers:{...access,...auth,'Content-Type':'application/json'},...(method==='POST'?{body:'{}'}:{}),signal:AbortSignal.timeout(15000)});
            console.log(`${path}: HTTP ${r.status}`);
            if(path==='/api/project.all' && r.status===200){const p=await r.json(); console.log(JSON.stringify({inventoryArray:Array.isArray(p),appMappingCounts:Object.fromEntries(['admin','api','auth','cflop','deploy','secrets','status','web'].map(app=>[app,Array.isArray(p)?p.flatMap(x=>(x.environments??[]).flatMap(e=>e.compose??[])).filter(c=>c.name===app).length:0]))}));}
            else await r.body?.cancel();
          }
          JS
