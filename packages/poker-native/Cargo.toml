[package]
name = "poker-native"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["backup", "bundled"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
imageproc = { version = "0.26.1", default-features = false, features = ["text"] }
base64 = "0.22.1"
ocrs = "0.12.2"
rten = "0.24.0"
regex = "1"
anyhow = "1"
sha2 = "0.10"
md-5 = "0.10"
libc = "0.2"
chrono = "0.4"
http = "1"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
ab_glyph = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
